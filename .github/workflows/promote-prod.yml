name: Promote to Prod

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Image tag to promote to prod. Leave blank to use qa-latest."
        required: false
        type: string

jobs:
  resolve-tag:
    name: Resolve Image Tag
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve tag from QA if not provided
        id: resolve
        run: |
          if [ -n "${{ inputs.image-tag }}" ]; then
            echo "::add-mask::${{ inputs.image-tag }}"
            echo "tag=${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
          else
            echo "No tag provided — fetching latest QA image..."

            PROJECT="cicd-gh-action-test"
            APP="svelte-rooms"

            TASK_DEF=$(aws ecs describe-services \
              --cluster ${PROJECT}-qa \
              --services ${PROJECT}-qa-${APP} \
              --query 'services[0].taskDefinition' \
              --output text)

            IMAGE=$(aws ecs describe-task-definition \
              --task-definition $TASK_DEF \
              --query 'taskDefinition.containerDefinitions[0].image' \
              --output text)

            TAG=$(echo $IMAGE | cut -d: -f2)

            echo "::add-mask::$TASK_DEF"
            echo "::add-mask::$IMAGE"
            echo "::add-mask::$TAG"

            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

  deploy-prod:
    name: Deploy to Prod
    needs: resolve-tag
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      image-tag: ${{ needs.resolve-tag.outputs.image-tag }}
    secrets: inherit
