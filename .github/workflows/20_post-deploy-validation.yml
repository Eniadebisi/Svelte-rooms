name: "20. Post-Deploy Validation"
run-name: "Post-Deploy Validation"

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Stage 6 Secret Detection — Scheduled Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Git leaks check
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

