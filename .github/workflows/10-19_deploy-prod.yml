name: Deploy Prod & Tag Release
run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches: [main]

jobs:
  retag:
    name: Retag QA image for Prod
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.tag.outputs.image-tag }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Retag QA image as Prod
        id: tag
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          git fetch --tags
          VERSION=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -z "$VERSION" ]; then
            echo "No semver tags found — cannot resolve QA image to promote"
            exit 1
          fi
          REPO="${{ secrets.ECR_REPOSITORY }}"

          QA_SHA=$(git rev-list -n 1 $VERSION | head -c7)
          QA_TAG="qa-${QA_SHA}"

          PROD_TAG="prod-${VERSION}"

          docker pull $REGISTRY/$REPO:$QA_TAG

          docker tag $REGISTRY/$REPO:$QA_TAG $REGISTRY/$REPO:$PROD_TAG

          docker push $REGISTRY/$REPO:$PROD_TAG

          echo "image-tag=${PROD_TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy AWS Prod
    needs: [retag]
    uses: ./.github/workflows/_deploy-eks.yml
    with:
      environment: prod
      image-tag: ${{ needs.retag.outputs.image-tag }}
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: [retag, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.retag.outputs.version }} \
            --title "${{ needs.retag.outputs.version }}" \
            --notes "${{ github.event.head_commit.message }}" \
            --latest \
            || echo "Release already exists"