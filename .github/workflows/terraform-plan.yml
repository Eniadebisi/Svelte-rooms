name: Terraform Plan

on:
  pull_request:
    paths:
      - '*.tf'
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write
  
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Fetch Terraform vars from SSM
        run: |
          get() { aws ssm get-parameter --name "$1" --with-decryption --query Parameter.Value --output text; }

          DB_PW=$(get /cicd-gh-action-test/terraform/db-password)
          JWT=$(get /cicd-gh-action-test/terraform/jwt-access-secret)
          EMAIL=$(get /cicd-gh-action-test/terraform/auth-email)
          EMAIL_PW=$(get /cicd-gh-action-test/terraform/auth-email-pw)

          echo "::add-mask::$DB_PW"
          echo "::add-mask::$JWT"
          echo "::add-mask::$EMAIL_PW"

          echo "TF_VAR_db_password=$DB_PW"         >> $GITHUB_ENV
          echo "TF_VAR_jwt_access_secret=$JWT"     >> $GITHUB_ENV
          echo "TF_VAR_auth_email=$EMAIL"          >> $GITHUB_ENV
          echo "TF_VAR_auth_email_pw=$EMAIL_PW"    >> $GITHUB_ENV

      - name: Terraform fmt check
        run: terraform fmt -recursive -check
        continue-on-error: true

      - name: Terraform init
        run: terraform init -chdir=terraform/global

      - name: Terraform validate
        run: terraform validate -chdir=terraform/global

      - name: Terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -out=tfplan -chdir=terraform/global 2>&1 | tee plan-output.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan-output.txt', 'utf8');
            if (plan.length > 65000) {
              plan = '...output truncated (too large)\n\n' + plan.slice(-65000);
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '```\n' + plan + '\n```'
            });
