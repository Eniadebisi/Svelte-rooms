name: Terraform Plan

on:
  pull_request:
    paths:
      - '*.tf'
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write
  
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Fetch Terraform vars from SSM
        run: |
          get() { aws ssm get-parameter --name "$1" --with-decryption --query Parameter.Value --output text; }

          GLOBAL_DB_PW=$(get /svelte-rooms/dev/db-password)
          JWT=$(get /svelte-rooms/dev/jwt-access-secret)
          EMAIL=$(get /svelte-rooms/dev/auth-email)
          EMAIL_PW=$(get /svelte-rooms/dev/auth-email-pw)
          PLATFORM_DB_PW=$(get /svelte-rooms/db-password)

          echo "::add-mask::$GLOBAL_DB_PW"
          echo "::add-mask::$JWT"
          echo "::add-mask::$EMAIL_PW"
          echo "::add-mask::$PLATFORM_DB_PW"

          echo "GLOBAL_DB_PW=$GLOBAL_DB_PW"         >> $GITHUB_ENV
          echo "PLATFORM_DB_PW=$PLATFORM_DB_PW"     >> $GITHUB_ENV
          echo "TF_VAR_jwt_access_secret=$JWT"      >> $GITHUB_ENV
          echo "TF_VAR_auth_email=$EMAIL"           >> $GITHUB_ENV
          echo "TF_VAR_auth_email_pw=$EMAIL_PW"     >> $GITHUB_ENV

      - name: Terraform fmt check
        run: terraform fmt -recursive -check
        continue-on-error: true

      - name: Terraform init (global)
        run: terraform init -chdir=terraform/global

      - name: Terraform validate (global)
        run: terraform validate -chdir=terraform/global

      - name: Terraform plan (global)
        id: plan-global
        run: |
          export TF_VAR_db_password="$GLOBAL_DB_PW"
          set -o pipefail
          terraform plan -no-color -chdir=terraform/global 2>&1 | tee plan-global.txt

      - name: Terraform init (platform)
        run: terraform init -chdir=terraform/platform

      - name: Terraform validate (platform)
        run: terraform validate -chdir=terraform/platform

      - name: Terraform plan (platform)
        id: plan-platform
        run: |
          export TF_VAR_db_password="$PLATFORM_DB_PW"
          set -o pipefail
          terraform plan -no-color -chdir=terraform/platform 2>&1 | tee plan-platform.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let global = fs.readFileSync('plan-global.txt', 'utf8');
            let platform = fs.readFileSync('plan-platform.txt', 'utf8');
            const truncate = (s) => s.length > 30000
              ? '...truncated\n\n' + s.slice(-30000) : s;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Global plan:**\n```\n' + truncate(global) + '\n```\n\n' +
                    '**Platform plan:**\n```\n' + truncate(platform) + '\n```'
            });
