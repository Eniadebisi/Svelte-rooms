name: Build

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Build on dev | qa | prod"
    outputs:
      image-tag:
        description: "ECR image tag built and pushed"
        value: ${{ jobs.build.outputs.image-tag }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          ENV="${{ inputs.environment }}"
          echo "tag=${ENV}-${SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          REPO="${{ secrets.ECR_REPOSITORY }}"
          TAG="${{ steps.meta.outputs.tag }}"

          docker build \
            -t $REPO:$TAG .

      - name: Trivy image scan (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          scanners: 'vuln,secret'
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          REPO="${{ secrets.ECR_REPOSITORY }}"
          TAG="${{ steps.meta.outputs.tag }}"

          docker push $REPO:$TAG