name: Deploy to Dev

on:
  push:
    branches: [dev]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      environment: dev
    secrets: inherit

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      image-tag:   ${{ needs.build.outputs.image-tag }}
    secrets: inherit