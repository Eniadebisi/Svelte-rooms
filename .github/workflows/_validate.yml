name: Validate

on:
  workflow_call:

jobs:
  validate:
    name: SAST & Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        continue-on-error: true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.10.0"

      - name: Fix terraform permissions
        run: chmod +x ${TERRAFORM_CLI_PATH}/terraform 2>/dev/null || true

      - name: Terraform fmt check
        run: terraform fmt -recursive -check -write=false terraform/
        continue-on-error: true

      - name: Terraform init (global)
        run: terraform -chdir=terraform/global init -backend=false

      - name: Terraform validate (global)
        run: terraform -chdir=terraform/global validate

      - name: Terraform init (platform)
        run: terraform -chdir=terraform/platform init -backend=false

      - name: Terraform validate (platform)
        run: terraform -chdir=terraform/platform validate

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/svelte-rooms

      - name: Trivy Helm config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: helm/svelte-rooms
          exit-code: "1"
          severity: HIGH,CRITICAL

  trivy-sarif:
    name: Trivy SARIF (Security Tab)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
