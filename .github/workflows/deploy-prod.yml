name: Deploy Prod & Tag Release
run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches: [main]

jobs:
  retag:
    name: Retag QA image for Prod
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.image-tag }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Retag QA image as Prod
        id: tag
        run: |
          git fetch --tags
          VERSION=$(git tag -l 'v*' | sort -V | tail -1)
          REPO="${{ secrets.ECR_REPOSITORY }}"
          PROD_TAG="prod-${VERSION}"

          docker pull $REPO:qa-latest

          docker tag $REPO:qa-latest $REPO:$PROD_TAG
          docker tag $REPO:qa-latest $REPO:prod-latest

          docker push $REPO:$PROD_TAG
          docker push $REPO:prod-latest

          echo "image-tag=${PROD_TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy AWS Prod
    needs: [retag]
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      image-tag: ${{ needs.retag.outputs.image-tag }}
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: [retag, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.retag.outputs.version }} \
            --title "${{ needs.retag.outputs.version }}" \
            --notes "${{ github.event.head_commit.message }}" \
            --latest \
            || echo "Release already exists"