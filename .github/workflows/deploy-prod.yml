name: Deploy to Prod

on:
  push:
    branches: [main]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      environment: prod
    secrets: inherit

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      image-tag:   ${{ needs.build.outputs.image-tag }}
    secrets: inherit