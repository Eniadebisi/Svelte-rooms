name: Infra Up

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  # ── Read per-environment secrets ──────────────────────────────
  # Each job is scoped to a GitHub Environment so secrets.JWT_ACCESS_SECRET
  # etc. resolve to that environment's values. Jobs run in parallel.
  # dev has no Terraform infrastructure — qa and prod only.
  # RDS_PASSWORD is repo-level (shared DB instance, not per-env).

  read-qa:
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      jwt_access_secret: ${{ steps.out.outputs.jwt_access_secret }}
      auth_email:        ${{ steps.out.outputs.auth_email }}
      auth_email_pw:     ${{ steps.out.outputs.auth_email_pw }}
    steps:
      - id: out
        run: |
          echo "jwt_access_secret=${{ secrets.JWT_ACCESS_SECRET }}" >> $GITHUB_OUTPUT
          echo "auth_email=${{ secrets.AUTH_EMAIL }}"               >> $GITHUB_OUTPUT
          echo "auth_email_pw=${{ secrets.AUTH_EMAIL_PW }}"         >> $GITHUB_OUTPUT

  read-prod:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      jwt_access_secret: ${{ steps.out.outputs.jwt_access_secret }}
      auth_email:        ${{ steps.out.outputs.auth_email }}
      auth_email_pw:     ${{ steps.out.outputs.auth_email_pw }}
    steps:
      - id: out
        run: |
          echo "jwt_access_secret=${{ secrets.JWT_ACCESS_SECRET }}" >> $GITHUB_OUTPUT
          echo "auth_email=${{ secrets.AUTH_EMAIL }}"               >> $GITHUB_OUTPUT
          echo "auth_email_pw=${{ secrets.AUTH_EMAIL_PW }}"         >> $GITHUB_OUTPUT

  # ── Terraform + Helm ──────────────────────────────────────────

  up:
    runs-on: ubuntu-latest
    needs: [read-qa, read-prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build Terraform map vars
        run: |
          QA_JWT="${{ needs.read-qa.outputs.jwt_access_secret }}"
          PROD_JWT="${{ needs.read-prod.outputs.jwt_access_secret }}"
          QA_EMAIL="${{ needs.read-qa.outputs.auth_email }}"
          PROD_EMAIL="${{ needs.read-prod.outputs.auth_email }}"
          QA_EMAIL_PW="${{ needs.read-qa.outputs.auth_email_pw }}"
          PROD_EMAIL_PW="${{ needs.read-prod.outputs.auth_email_pw }}"

          echo "::add-mask::$QA_JWT"
          echo "::add-mask::$PROD_JWT"
          echo "::add-mask::$QA_EMAIL_PW"
          echo "::add-mask::$PROD_EMAIL_PW"

          echo "TF_VAR_jwt_access_secret={\"qa\":\"$QA_JWT\",\"prod\":\"$PROD_JWT\"}"             >> $GITHUB_ENV
          echo "TF_VAR_auth_email={\"qa\":\"$QA_EMAIL\",\"prod\":\"$PROD_EMAIL\"}"                >> $GITHUB_ENV
          echo "TF_VAR_auth_email_pw={\"qa\":\"$QA_EMAIL_PW\",\"prod\":\"$PROD_EMAIL_PW\"}"       >> $GITHUB_ENV
          echo "TF_VAR_dev_user_arns=${{ secrets.DEV_USER_ARNS }}"                               >> $GITHUB_ENV
          echo "TF_VAR_rds_password=${{ secrets.RDS_PASSWORD }}"                                 >> $GITHUB_ENV

      - name: Terraform init
        run: terraform -chdir=terraform/platform init

      - name: Terraform apply
        run: terraform -chdir=terraform/platform apply -auto-approve

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name svelte-rooms --region ${{ secrets.AWS_REGION }}

      - name: Apply CloudWatch log router ConfigMap
        run: |
          kubectl create namespace aws-observability --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f monitoring/aws-logging-configmap.yaml

      - name: Add Helm repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add jaegertracing https://jaegertracing.github.io/helm-charts
          helm repo update

      - name: Install Prometheus
        run: |
          helm upgrade --install prometheus prometheus-community/prometheus \
            -n observability \
            --create-namespace \
            -f monitoring/prometheus-values.yaml

      - name: Install Jaeger
        run: |
          helm upgrade --install jaeger jaegertracing/jaeger \
            -n observability \
            -f monitoring/jaeger-values.yaml

      - name: Deploy prod with backup CronJob enabled
        run: |
          BACKUP_ROLE=$(terraform -chdir=terraform/platform output -raw backup_role_arn)
          BACKUP_BUCKET=$(terraform -chdir=terraform/global output -raw backups_bucket_name 2>/dev/null || echo "svelte-rooms-backups")

          helm upgrade --install svelte-rooms ./helm/svelte-rooms \
            -n prod \
            --create-namespace \
            -f helm/svelte-rooms/values-prod.yaml \
            --set backup.roleArn="$BACKUP_ROLE" \
            --set backup.bucket="$BACKUP_BUCKET" \
            --atomic --wait --timeout 5m || echo "Prod not yet deployed — backup CronJob will be applied on next deploy"
