name: Build and Push

on:
  push:
    branches: [dev]
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    outputs:
      image-tag:
        description: "The image tag that was built and pushed"
        value: ${{ jobs.build.outputs.image-tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          ENV=${{ inputs.environment || 'dev' }}
          echo "tag=${ENV}-${SHA}" >> $GITHUB_OUTPUT
          echo "env=${ENV}" >> $GITHUB_OUTPUT

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO:     ${{ secrets.ECR_REPOSITORY }}
          TAG:      ${{ steps.meta.outputs.tag }}
          ENV:      ${{ steps.meta.outputs.env }}
        run: |
          echo "TAG=$TAG"
          echo "ENV=$ENV"
          docker build \
            --build-arg SITE_NAME="${{ secrets.SITE_NAME }}" \
            --build-arg JWT_ACCESS_SECRET="${{ secrets.JWT_ACCESS_SECRET }}" \
            --build-arg MODE="${{ secrets.MODE }}" \
            --build-arg CONTACT_EMAIL="${{ secrets.CONTACT_EMAIL }}" \
            --build-arg TIME_ZONE="${{ secrets.TIME_ZONE }}" \
            --build-arg AUTH_EMAIL="${{ secrets.AUTH_EMAIL }}" \
            --build-arg AUTH_EMAIL_PW="${{ secrets.AUTH_EMAIL_PW }}" \
            --build-arg SMTP_HOST="${{ secrets.SMTP_HOST }}" \
            --build-arg SMTP_PORT="${{ secrets.SMTP_PORT }}" \
            -t $REPO:$TAG -t $REPO:$ENV-latest .
          docker push $REPO:$TAG
          docker push $REPO:$ENV-latest
          echo "Built and pushed $REPO:$TAG"