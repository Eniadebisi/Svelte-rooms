replicaCount: 2

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

backup:
  enabled: true
  schedule: "0 3 * * *"
  bucket: "svelte-rooms-backups"

env:
  NODE_ENV: "production"
  MODE: "production"
