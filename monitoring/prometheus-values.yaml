alertmanager:
  enabled: false

pushgateway:
  enabled: false

nodeExporter:
  enabled: false  # no nodes on Fargate

server:
  retention: 24h
  persistentVolume:
    enabled: false  # ephemeral — data lost on pod restart, acceptable for this project
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  global:
    scrape_interval: 30s
    evaluation_interval: 30s

serverFiles:
  alerting_rules.yml: {}  # loaded separately via extraConfigmapMounts

extraScrapeConfigs: |
  - job_name: 'svelte-rooms'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
